<div class="form-card">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label>Libellé *</label>
      <input formControlName="libelle" type="text" placeholder="EDF, Courses…" />
    </div>

    <div class="row">
      <div class="field">
        <label>Compte *</label>
        <select formControlName="compte">
          <option value="CCM">CCM</option>
          <option value="Boursorama">Boursorama</option>
        </select>
      </div>
      <div class="field">
        <label>Sens *</label>
        <select formControlName="sens">
          <option value="debit">Débit</option>
          <option value="credit">Crédit</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Montant * (€)</label>
      <input formControlName="montant" type="number" min="0" step="0.01" placeholder="0.00" />
    </div>

    <div class="checkbox-row">
      <input type="checkbox" formControlName="dejaDebite" id="dejaDebite" />
      <label for="dejaDebite">Déjà débité / crédité</label>
    </div>

    @if (form.get('dejaDebite')?.value) {
      <div class="field">
        <label>Date de l'opération *</label>
        <input formControlName="date" type="number" min="1" max="31" placeholder="Jour (ex: 15)" />
      </div>
    }

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Enregistrement…' : 'Enregistrer' }}
    </button>
  </form>
</div>
